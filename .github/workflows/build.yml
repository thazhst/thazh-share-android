name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes
# on a build that's about to be replaced by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug & release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # android-actions/setup-android defaults `packages` to
          # "tools platform-tools". Google discontinued the standalone
          # `tools` package years ago, so sdkmanager now exits with
          # "Failed to find package 'tools'" and this step fails outright.
          # We install exactly what we need in the next step instead, so
          # skip the action's own built-in package install here.
          packages: ''

      - name: Install required Android SDK packages
        # android-actions/setup-android provisions the SDK *manager* and
        # accepts licenses, but does not pre-install specific platform /
        # build-tools versions. The Android Gradle Plugin can auto-download
        # missing packages during the build, but doing it explicitly here
        # fails fast with a clear step name if something's wrong, rather
        # than surfacing as an opaque Gradle build error later.
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      # This repository's committed gradlew/gradlew.bat scripts and
      # gradle-wrapper.jar were authored without access to a real Gradle
      # installation or network access to Gradle's distribution servers, so
      # they could not be verified against an actual Gradle toolchain before
      # being committed. `gradle wrapper` below regenerates all four wrapper
      # files (gradlew, gradlew.bat, gradle-wrapper.jar,
      # gradle-wrapper.properties) from this job's real, verified Gradle
      # installation, which is strictly safer than trusting the hand-authored
      # originals. gradle/actions/setup-gradle also transparently accelerates
      # and caches any ./gradlew invocation in this job regardless.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Regenerate Gradle wrapper from verified Gradle install
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//')
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret (raw JSON)."
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret (Base64)."
            fi
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) in GitHub Secrets."
            exit 1
          fi
          echo "app/google-services.json is present."

      - name: Restore keystore from RELEASE_KEYSTORE_BASE64 secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing. Please configure RELEASE_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi
          rm -f /tmp/secret.keystore release-debug.keystore debug.keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/secret.keystore

          # Determine source keystore password & alias (supports custom secrets, 'wifidirectchat', or 'android')
          SRC_PASS=""
          for candidate in "$RELEASE_STORE_PASSWORD" "wifidirectchat" "android"; do
            if [ -n "$candidate" ] && keytool -list -keystore /tmp/secret.keystore -storepass "$candidate" >/dev/null 2>&1; then
              SRC_PASS="$candidate"
              break
            fi
          done
          if [ -z "$SRC_PASS" ]; then
            echo "::error::Unable to unlock keystore from RELEASE_KEYSTORE_BASE64. Check RELEASE_STORE_PASSWORD."
            exit 1
          fi

          if [ -n "$RELEASE_KEY_ALIAS" ]; then
            SRC_ALIAS="$RELEASE_KEY_ALIAS"
          else
            SRC_ALIAS=$(keytool -list -v -keystore /tmp/secret.keystore -storepass "$SRC_PASS" | awk '/Alias name:/ {print $3; exit}')
          fi
          SRC_KEY_PASS="${RELEASE_KEY_PASSWORD:-$SRC_PASS}"

          # Provision release-debug.keystore and debug.keystore with the exact certificate from RELEASE_KEYSTORE_BASE64
          keytool -importkeystore \
            -srckeystore /tmp/secret.keystore -srcstorepass "$SRC_PASS" -srcalias "$SRC_ALIAS" -srckeypass "$SRC_KEY_PASS" \
            -destkeystore release-debug.keystore -deststorepass wifidirectchat -destalias wifidirectchat -destkeypass wifidirectchat \
            -noprompt
          keytool -importkeystore \
            -srckeystore /tmp/secret.keystore -srcstorepass "$SRC_PASS" -srcalias "$SRC_ALIAS" -srckeypass "$SRC_KEY_PASS" \
            -destkeystore debug.keystore -deststorepass android -destalias androiddebugkey -destkeypass android \
            -noprompt
          rm -f /tmp/secret.keystore
          echo "Restored signing keystores exclusively from RELEASE_KEYSTORE_BASE64 secret."

      - name: Lint (non-blocking)
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate build outputs
        id: outputs
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "Debug APK: $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: thazh-share-debug
          path: ${{ steps.outputs.outputs.debug_apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: thazh-share-release
          path: ${{ steps.outputs.outputs.release_apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report (if generated)
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # Only runs on an actual tagged release push (e.g. `git tag v1.0.0 && git push --tags`),
  # attaching the built APKs directly to a GitHub Release for easy download.
  attach-to-release:
    name: Attach APKs to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Regenerate Gradle wrapper from verified Gradle install
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore google-services.json from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//')
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret (raw JSON)."
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret (Base64)."
            fi
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) in GitHub Secrets."
            exit 1
          fi

      - name: Restore keystore from RELEASE_KEYSTORE_BASE64 secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing. Please configure RELEASE_KEYSTORE_BASE64 in GitHub Secrets."
            exit 1
          fi
          rm -f /tmp/secret.keystore release-debug.keystore debug.keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > /tmp/secret.keystore

          SRC_PASS=""
          for candidate in "$RELEASE_STORE_PASSWORD" "wifidirectchat" "android"; do
            if [ -n "$candidate" ] && keytool -list -keystore /tmp/secret.keystore -storepass "$candidate" >/dev/null 2>&1; then
              SRC_PASS="$candidate"
              break
            fi
          done
          if [ -z "$SRC_PASS" ]; then
            echo "::error::Unable to unlock keystore from RELEASE_KEYSTORE_BASE64. Check RELEASE_STORE_PASSWORD."
            exit 1
          fi

          if [ -n "$RELEASE_KEY_ALIAS" ]; then
            SRC_ALIAS="$RELEASE_KEY_ALIAS"
          else
            SRC_ALIAS=$(keytool -list -v -keystore /tmp/secret.keystore -storepass "$SRC_PASS" | awk '/Alias name:/ {print $3; exit}')
          fi
          SRC_KEY_PASS="${RELEASE_KEY_PASSWORD:-$SRC_PASS}"

          keytool -importkeystore \
            -srckeystore /tmp/secret.keystore -srcstorepass "$SRC_PASS" -srcalias "$SRC_ALIAS" -srckeypass "$SRC_KEY_PASS" \
            -destkeystore release-debug.keystore -deststorepass wifidirectchat -destalias wifidirectchat -destkeypass wifidirectchat \
            -noprompt
          keytool -importkeystore \
            -srckeystore /tmp/secret.keystore -srcstorepass "$SRC_PASS" -srcalias "$SRC_ALIAS" -srckeypass "$SRC_KEY_PASS" \
            -destkeystore debug.keystore -deststorepass android -destalias androiddebugkey -destkeypass android \
            -noprompt
          rm -f /tmp/secret.keystore

      - name: Build release APK (signed)
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate release APK
        id: outputs
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.outputs.outputs.release_apk }}
          generate_release_notes: true
